<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levit Picker V5.1 - 데이터 상태 중심형 추첨기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f3f4f6;
            --white: #ffffff; --text-main: #1f2937; --text-sub: #6b7280; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

        .app-card {
            width: 100%; max-width: 440px; background: var(--white);
            border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            padding: 28px;
        }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.6rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        
        .input-section { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"] {
            flex: 1; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px;
            font-size: 0.95rem; outline: none; transition: 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        .btn { border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; padding: 0 18px; }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.85rem; color: var(--text-sub); }
        .last-pick-box { font-weight: 600; color: #4b5563; }
        .last-pick-box span { color: var(--primary); font-weight: 800; }
        
        .list-wrapper {
            background: #f9fafb; border-radius: 12px; padding: 6px;
            max-height: 180px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #f1f5f9;
        }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: white; border-radius: 8px; margin-bottom: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .item-name-group { display: flex; align-items: center; gap: 8px; }
        .item-name { font-weight: 600; font-size: 0.95rem; }
        .item-count-tag { font-size: 0.75rem; color: var(--primary); background: #eef2ff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .btn-del { background: none; color: #d1d5db; font-size: 1.1rem; }
        .btn-del:hover { color: var(--danger); }

        .display-area {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 16px; color: white;
            min-height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.2);
        }
        .result-container { display: flex; align-items: baseline; gap: 6px; }
        #resultName { font-size: 1.4rem; font-weight: 800; }
        #resultCount { font-size: 0.85rem; opacity: 0.9; font-weight: 400; }
        .display-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

        .btn-main { width: 100%; padding: 15px; font-size: 1rem; background: var(--primary); color: white; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2); }
        .btn-main:active { transform: scale(0.98); }
        .btn-reset { width: 100%; padding: 8px; background: transparent; color: var(--text-sub); font-size: 0.8rem; text-decoration: underline; }
    </style>
</head>
<body>

<div class="app-card">
    <header>
        <h1>🎯 Levit Picker</h1>
    </header>

    <div class="input-section">
        <input type="text" id="itemInput" placeholder="추가할 항목 입력..." onkeypress="if(event.keyCode==13) addItem()">
        <button class="btn btn-add" onclick="addItem()">추가</button>
    </div>

    <div class="controls">
        <div class="last-pick-box">last pick : <span id="lastPickValue">-</span></div>
        <span id="totalStats">항목: 0개</span>
    </div>

    <div id="itemList" class="list-wrapper"></div>

    <div class="display-area">
        <div class="display-label">Now Selected</div>
        <div class="result-container">
            <div id="resultName">READY</div>
            <div id="resultCount"></div>
        </div>
    </div>

    <button class="btn btn-main" onclick="pickOne()">추첨 시작!</button>
    <button class="btn btn-reset" onclick="resetCountsOnly()">당첨 횟수만 초기화</button>
</div>

<script>
    // 상태 초기화 및 안전망 가동 (구버전 데이터 구조 완벽 방어)
    let state = JSON.parse(localStorage.getItem('levitPickerV5')) || { items: [], counts: {}, currentPick: '-', lastPick: '-' };
    if (!state.items) state.items = [];
    if (!state.counts) state.counts = {};
    if (!state.currentPick) state.currentPick = '-';
    if (!state.lastPick) state.lastPick = '-';

    function saveData() {
        localStorage.setItem('levitPickerV5', JSON.stringify(state));
        updateUI();
    }

    // UI 동기화를 단 한 곳에서 일괄 처리 (안정성 확보)
    function updateUI() {
        document.getElementById('totalStats').innerText = `항목: ${state.items.length}개`;
        document.getElementById('lastPickValue').innerText = state.lastPick;
        
        if (state.currentPick === '-') {
            document.getElementById('resultName').innerText = 'READY';
            document.getElementById('resultCount').innerText = '';
        } else {
            document.getElementById('resultName').innerText = state.currentPick;
            document.getElementById('resultCount').innerText = `(${state.counts[state.currentPick] || 0}회)`;
        }
    }

    function addItem() {
        const input = document.getElementById('itemInput');
        const val = input.value.trim();
        if (val && !state.items.includes(val)) {
            state.items.push(val);
            state.counts[val] = state.counts[val] || 0;
            saveData(); 
            renderList();
        }
        input.value = '';
    }

    function deleteItem(val) {
        state.items = state.items.filter(i => i !== val);
        delete state.counts[val];
        // 삭제된 항목 처리 예외 방어
        if (state.lastPick === val) state.lastPick = '-';
        if (state.currentPick === val) state.currentPick = '-';
        saveData(); 
        renderList();
    }

    function renderList() {
        const listDiv = document.getElementById('itemList');
        listDiv.innerHTML = state.items.map(item => `
            <div class="item-row">
                <div class="item-name-group">
                    <span class="item-name">${item}</span>
                    <span class="item-count-tag">${state.counts[item] || 0}회</span>
                </div>
                <button class="btn btn-del" onclick="deleteItem('${item}')">&times;</button>
            </div>
        `).join('') || '<div style="text-align:center; padding: 20px; color:#d1d5db; font-size:0.8rem;">항목을 추가해주세요.</div>';
    }

    function pickOne() {
        if (state.items.length === 0) return alert('항목을 먼저 추가해주세요!');
        
        // [수정 핵심] 화면 텍스트가 아닌, 내부 데이터(state.currentPick)를 기준으로 직전 항목 이관
        if (state.currentPick && state.currentPick !== '-') {
            state.lastPick = state.currentPick;
        }

        // 무작위 추첨
        const idx = Math.floor(Math.random() * state.items.length);
        const selected = state.items[idx];

        // 상태 데이터 갱신
        state.counts[selected] = (state.counts[selected] || 0) + 1;
        state.currentPick = selected;
        
        saveData(); 
        renderList();
    }

    function resetCountsOnly() {
        if(confirm('리스트는 유지하고 모든 당첨 횟수와 직전 기록을 초기화할까요?')) {
            state.items.forEach(item => {
                state.counts[item] = 0;
            });
            state.currentPick = '-';
            state.lastPick = '-';
            saveData(); 
            renderList();
        }
    }

    // 초기 실행 환경 구동
    renderList();
    updateUI();
</script>
</body>
</html>
